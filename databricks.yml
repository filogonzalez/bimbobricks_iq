# BimboBricks IQ · Ola 2 — Databricks Asset Bundle
#
# Para publicar una versión nueva de la web:
#   1. Deja SOLO el HTML nuevo dentro de html/
#   2. ./deploy.sh prod            (o: databricks bundle deploy -t prod && databricks bundle run -t prod bimbobricks_iq)
#
# El hook predeploy ejecuta scripts/prepare.py: valida el HTML, extrae el vídeo y cablea los endpoints.
bundle:
  name: bimbobricks-iq

include:
  - resources/*.yml

experimental:
  scripts:
    predeploy: python3 scripts/prepare.py

sync:
  # El HTML original (8+ MB) y el vídeo extraído no se suben con el código: el vídeo va al Volume.
  exclude:
    - html/**
    - build/**
    - tests/**
    - samples/**

variables:
  catalog:
    description: Catálogo de Unity Catalog existente donde se crea el esquema del programa.
  schema:
    description: Esquema de UC para Volumes (se crea con el bundle).
    default: bimbobricks_iq
  forms_catalog:
    description: Catálogo de UC nuevo que expone la base Lakebase de formularios (solo lectura / analítica). Requiere CREATE CATALOG en el metastore.
  app_name:
    description: Nombre de la Databricks App (minúsculas y guiones, máx. 30 caracteres).
  db_project_id:
    description: ID del proyecto Lakebase Autoscaling (minúsculas, números y guiones).
  db_max_cu:
    description: Máximo de Compute Units del cómputo Lakebase (autoescala desde 0,5 CU; ~2 GB de RAM por CU).
    default: 2
  app_users_group:
    description: Grupo del workspace que puede abrir la web (CAN_USE).
    default: users

targets:
  dev:
    default: true
    workspace:
      host: https://adb-1844781131568521.1.azuredatabricks.net
    variables:
      catalog: cat_coe_dv
      schema: bimbobricks_iq_dev
      forms_catalog: bimbobricks_forms_dev
      app_name: bimbobricks-iq-dev
      db_project_id: bimbobricks-iq-dev
      # app_users_group: el valor por defecto (users) → la ve todo el workspace, igual que prod

  prod:
    workspace:
      host: https://adb-1844781131568521.1.azuredatabricks.net
    variables:
      catalog: main                     # ← AJUSTAR al catálogo real
      schema: bimbobricks_iq
      forms_catalog: bimbobricks_forms
      app_name: bimbobricks-iq
      db_project_id: bimbobricks-iq
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
